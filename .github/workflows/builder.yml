name: builder

on:
  schedule:
    - cron: "30 9 * * 1" # Mondays 09:30 UTC — ~30 min after the-org writes the sprint
  workflow_dispatch: {} # manual trigger (use this to test + for the first approved sprints)

permissions:
  contents: write # create the branch + commits
  pull-requests: write # open the PR
  id-token: write # required by claude-code-action

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci || npm install

      - name: Find the next unbuilt sprint
        id: fetch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node .github/scripts/build-prompt.mjs

      - name: Build it
        if: steps.fetch.outputs.sprint != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.fetch.outputs.prompt }}
          model: claude-sonnet-4-6 # ~5x cheaper than Opus; plenty for these features
          # bypass = hands-off in CI (no human to approve prompts). Safe here:
          # isolated runner, and the CI guard still blocks spine/lib edits on the PR.
          claude_args: "--permission-mode bypassPermissions"

      # A run that completes but pushes no branch built nothing. Treat that as a
      # failure (so it stays red and retries) instead of silently marking it built.
      - name: Confirm the builder pushed a PR branch
        id: verify
        if: steps.fetch.outputs.sprint != ''
        run: |
          branch="sprint-${{ steps.fetch.outputs.sprint }}-build"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Found $branch — the agent produced a PR branch."
          else
            echo "No $branch on origin — the agent did not open a PR. Failing so it retries."
            exit 1
          fi

      - name: Mark the sprint built
        if: steps.fetch.outputs.sprint != '' && steps.verify.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node .github/scripts/mark-built.mjs ${{ steps.fetch.outputs.sprint }}
