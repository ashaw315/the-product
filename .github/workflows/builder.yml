name: builder

on:
  schedule:
    - cron: "30 9 * * 1" # Mondays 09:30 UTC — ~30 min after the-org writes the sprint
  workflow_dispatch: {} # manual trigger (use this to test + for the first approved sprints)

permissions:
  contents: write # create the branch + commits
  pull-requests: write # open the PR
  id-token: write # required by claude-code-action

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci || npm install

      - name: Find the next unbuilt sprint
        id: fetch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node .github/scripts/build-prompt.mjs

      - name: Build it
        if: steps.fetch.outputs.sprint != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.fetch.outputs.prompt }}
          # Defaults to Sonnet. To use Opus on a hard sprint: model: claude-opus-4-7

      - name: Mark the sprint built
        if: steps.fetch.outputs.sprint != '' && success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node .github/scripts/mark-built.mjs ${{ steps.fetch.outputs.sprint }}
